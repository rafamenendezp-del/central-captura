name: keepalive-supabase

# Mantiene despierto el proyecto de Supabase (plan gratis) haciéndole un "ping"
# diario. Supabase pausa por inactividad (~7 días); esto nunca lo deja dormir.

on:
  schedule:
    - cron: '17 9 * * *'    # diario, 9:17 UTC (~3:17 a.m. en Puebla)
  workflow_dispatch:         # también se puede correr a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase
        run: |
          URL="https://rafamenendezp-del.github.io/central-captura/"
          ANON="sb_publishable_ASUo91elaRUnxSmThrlT3g_rKqjZoAo"
          echo "Haciendo ping a $URL ..."
          curl -sS -o /dev/null -w "Respuesta: HTTP %{http_code}\n" \
            "$URL/rest/v1/pedidos?select=id&limit=1" \
            -H "apikey: $ANON" \
            -H "Authorization: Bearer $ANON"
